name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      issues: read
      statuses: write
      checks: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Upgrade npm for trusted publishing
        # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
        # pnpm publish hands the upload to this npm.
        run: npm install -g npm@11.21.2

      - name: Install dependencies
        run: pnpm install

      - name: Build release
        run: pnpm build

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          commit: 'ci(repo): Version packages'
          title: 'ci(repo): Version packages'
          publish: pnpm release
          # Workaround for https://github.com/changesets/changesets/issues/421
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: with it unset, changesets/action publishes via npm
          # trusted publishing (OIDC, needs id-token: write above).
